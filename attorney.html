
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>IKMW Law | Attorney Profile</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      color: #1f2937;
      background: white;
      line-height: 1.6;
    }

    header {
      padding: 20px 8%;
      border-bottom: 1px solid #e5e7eb;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: white;
    }

    .logo a {
      color: #111827;
      text-decoration: none;
      font-size: 22px;
      font-weight: bold;
    }

    nav a {
      margin-left: 24px;
      text-decoration: none;
      color: #1f2937;
    }

    .hero {
      background: #f3f4f6;
      padding: 70px 8%;
    }

    .hero-inner {
      max-width: 1100px;
      margin: auto;
      display: grid;
      grid-template-columns: 340px 1fr;
      gap: 60px;
      align-items: center;
    }

    .hero img {
      width: 100%;
      height: 440px;
      object-fit: cover;
      object-position: center top;
      border-radius: 14px;
    }

    .hero h1 {
      font-size: 46px;
      margin: 0 0 15px;
      color: #111827;
    }

    .hero-title {
      font-size: 24px;
      color: #4b5563;
      font-weight: 600;
    }

    .section {
      padding: 60px 8%;
    }

    .section:nth-child(even) {
      background: #f8fafc;
    }

    .inner {
      max-width: 950px;
      margin: auto;
    }

    h2 {
      font-size: 30px;
      color: #111827;
      margin-top: 0;
    }

    p,
    li {
      font-size: 18px;
      color: #4b5563;
    }

    ul {
      padding-left: 24px;
    }

    footer {
      padding: 28px 8%;
      text-align: center;
      border-top: 1px solid #e5e7eb;
      color: #6b7280;
    }

    @media (max-width: 800px) {
      .hero-inner {
        grid-template-columns: 1fr;
      }

      .hero img {
        max-width: 400px;
      }

      .hero h1 {
        font-size: 36px;
      }

      header {
        display: block;
      }

      nav {
        margin-top: 12px;
      }

      nav a {
        margin-left: 0;
        margin-right: 18px;
      }
    }
  </style>
</head>


<body>

  <header>

    <div class="logo">
      <a href="index.html">IKMW Law</a>
    </div>

    <nav>
      <a href="index.html">Home</a>
      <a href="index.html#about">About</a>
      <a href="index.html#services">Services</a>
      <a href="index.html#contact">Contact</a>
    </nav>

  </header>


  <main>

    <!-- PROFILE -->

    <section class="hero">

      <div class="hero-inner">

        <div>
          <img
            src="images/attorney1.jpeg"
            alt="Attorney profile">
        </div>

        <div>

          <h1>Attorney Name</h1>

          <div class="hero-title">
            California Regional Managing Partner <br> 
            International Relations
          </div>

        </div>

      </div>

    </section>


    <!-- BIOGRAPHY -->

    <section class="section">

      <div class="inner">

        <h2>Biography</h2>

        <p>
          BIO
        </p>

      </div>

    </section>


    <!-- ADMISSIONS -->

    <section class="section">

      <div class="inner">

        <h2>Admissions</h2>

        <ul>
          <li>admin 1</li>
          <li>admin 2</li>
        </ul>

      </div>

    </section>


    <!-- EDUCATION -->

    <section class="section">

      <div class="inner">

        <h2>Education</h2>

        <ul>
          <li>ed 1</li>
          <li>ed 2</li>
        </ul>

      </div>

    </section>


    <!-- INTERESTS -->

    <section class="section">

      <div class="inner">

        <h2>Interests</h2>

        <p>
          Interests
        </p>

      </div>

    </section>

  </main>


  <footer>
    © 2026 IKMW Law. All rights reserved.
  </footer>

</body>

</html>
